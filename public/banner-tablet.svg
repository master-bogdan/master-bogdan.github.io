    <text x="26" y="94" font-size="22" font-weight="700" fill="#18C7FF">Senior Software Engineer &amp; Tech Lead</text>
    <text x="26" y="130" font-size="20" fill="#00FF66" stroke="#05070B" stroke-width="2" paint-order="stroke fill" stroke-linejoin="round">Building software products, cloud platforms,</text>
    <text x="26" y="158" font-size="20" fill="#00FF66" stroke="#05070B" stroke-width="2" paint-order="stroke fill" stroke-linejoin="round">and agentic AI workflows — from architecture to production.</text>
  </g>
