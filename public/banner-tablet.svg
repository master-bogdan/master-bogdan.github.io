        <path d="M64 56C62 39 73 28 89 27" stroke-opacity="0.35" />
        <path d="M58 98C39 82 22 83 23 99C24 109 35 110 39 103" />
        <path d="M65 104C44 112 55 130 44 137C40 140 34 139 34 135" />
